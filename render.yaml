databases:
- name: astrospect_db
  plan: basic-256mb
  region: Ohio

services:
  - type: web
    name: astrospect
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: astrospect
          property: host
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: astrospect_db
          property: connectionString
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
