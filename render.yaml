services:
  - type: web
    name: astrological-introspection
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: astrological-introspection
          property: host
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # add a fine-grained Hugging Face token with Inference Providers access.
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: ""
